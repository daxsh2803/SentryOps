version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentryops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentryops}
      POSTGRES_DB: ${POSTGRES_DB:-sentryops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentryops} -d ${POSTGRES_DB:-sentryops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./microservices/api-gateway
    ports:
      - "8000:8000"
    environment:
      - ORDER_SERVICE_URL=http://order-service:8001
    depends_on:
      - order-service

  order-service:
    build: ./microservices/order-service
    ports:
      - "8001:8001"
    environment:
      - PAYMENT_SERVICE_URL=http://payment-service:8002
      - NOTIFICATION_SERVICE_URL=http://notification-service:8003
      - DB_HOST=postgres
    depends_on:
      - payment-service
      - notification-service
      postgres:
        condition: service_healthy

  payment-service:
    build: ./microservices/payment-service
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build: ./microservices/notification-service
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  user-service:
    build: ./microservices/user-service
    ports:
      - "8004:8004"

volumes:
  postgres_data:
  redis_data:
