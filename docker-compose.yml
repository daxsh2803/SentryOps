version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentryops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentryops}
      POSTGRES_DB: ${POSTGRES_DB:-sentryops}
    ports:
      - "5432:5432"
      fault-injection:
    build: ./fault-injection
    ports:
      - "8005:8005"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentryops} -d ${POSTGRES_DB:-sentryops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
      fault-injection:
    build: ./fault-injection
    ports:
      - "8005:8005"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
      fault-injection:
    build: ./fault-injection
    ports:
      - "8005:8005"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
      fault-injection:
    build: ./fault-injection
    ports:
      - "8005:8005"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      fault-injection:
    build: ./fault-injection
    ports:
      - "8005:8005"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger

  api-gateway:
    build: ./microservices/api-gateway
    ports:
      - "8000:8000"
    environment:
      - ORDER_SERVICE_URL=http://order-service:8001
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - order-service
      - loki
      - jaeger

  order-service:
    build: ./microservices/order-service
    ports:
      - "8001:8001"
    environment:
      - PAYMENT_SERVICE_URL=http://payment-service:8002
      - NOTIFICATION_SERVICE_URL=http://notification-service:8003
      - DB_HOST=postgres
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - payment-service
      - notification-service
      - loki
      - jaeger
      postgres:
        condition: service_healthy

  payment-service:
    build: ./microservices/payment-service
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=postgres
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - loki
      - jaeger
      postgres:
        condition: service_healthy

  notification-service:
    build: ./microservices/notification-service
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - loki
      - jaeger
      redis:
        condition: service_healthy

  user-service:
    build: ./microservices/user-service
    ports:
      - "8004:8004"
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - loki
      - jaeger

  fault-injection:
    build: ./fault-injection
    ports:
      - "8005:8005"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

