# Fault injection API. It exposes no /health route, so a TCP probe is used and
# Redis readiness is handled by an init container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-injection
  namespace: sentryops
  labels:
    app: fault-injection
    app.kubernetes.io/name: fault-injection
    app.kubernetes.io/component: simulated-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fault-injection
  template:
    metadata:
      labels:
        app: fault-injection
        app.kubernetes.io/name: fault-injection
        app.kubernetes.io/component: simulated-production
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until redis-cli -h redis -p 6379 ping >/dev/null 2>&1; do echo "waiting for redis ..."; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: fault-injection
          image: sentryops/fault-injection:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
          envFrom:
            - configMapRef:
                name: sentryops-config
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fault-injection
  namespace: sentryops
  labels:
    app: fault-injection
    app.kubernetes.io/name: fault-injection
    app.kubernetes.io/component: simulated-production
spec:
  type: ClusterIP
  selector:
    app: fault-injection
  ports:
    - name: http
      port: 8005
      targetPort: http
