# NodePort is the simplest externally reachable option that works on Minikube,
# kind and Docker Desktop Kubernetes without an ingress controller.
#
# Reach it with:
#   minikube:       minikube service frontend -n sentryops
#   Docker Desktop: http://localhost:30080
#   kind:           requires a node port mapping at cluster creation time
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sentryops
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
