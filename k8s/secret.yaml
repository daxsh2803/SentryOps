# LOCAL DEVELOPMENT CREDENTIALS ONLY.
#
# These values match the defaults already shipped in docker-compose.yml so the
# local Kubernetes deployment behaves identically to the Compose one. They are
# placeholders, not real secrets.
#
# For anything beyond a throwaway local cluster, replace this Secret instead of
# committing a value. Two supported options:
#
#   1. Create the Secret out-of-band and delete this file from kustomization.yaml:
#        kubectl create secret generic sentryops-secrets -n sentryops \
#          --from-literal=POSTGRES_PASSWORD='<strong-password>' \
#          --from-literal=DATABASE_URL='postgresql+psycopg2://sentryops:<strong-password>@postgres:5432/sentryops'
#
#   2. Generate a random local password:
#        kubectl create secret generic sentryops-secrets -n sentryops \
#          --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#          --from-literal=DATABASE_URL="postgresql+psycopg2://sentryops:$(openssl rand -hex 16)@postgres:5432/sentryops"
#
# Never commit real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: sentryops-secrets
  namespace: sentryops
  labels:
    app.kubernetes.io/part-of: sentryops
type: Opaque
stringData:
  POSTGRES_PASSWORD: sentryops
  DATABASE_URL: postgresql+psycopg2://sentryops:sentryops@postgres:5432/sentryops
